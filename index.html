/* DIGO v1.5 — handmade DropMesh-style comic remix: cream paper + chunky punchy panels */
:root{--ink:#1e1e32;--ink2:#454056;--cream:#fff8eb;--paper:#fffdf4;--purple:#bca9ff;--pink:#ffa9cd;--sky:#a4e5fa;--lime:#d7fb75;--yellow:#ffec76;--violet:#7253ef;--shadow:6px 7px 0 var(--ink)}

  function storeRead(){let val;try{val=JSON.parse(storage.getItem('digo:database')||'null');}catch{} if(val&&val.rooms){val.friendRequests ||= [];val.directMessages ||= [];let changed=false;for(const updated of PUBLIC_ROOMS){const existing=val.rooms.find(r=>r.id===updated.id);if(existing){for(const field of ['name','slug','description','icon']){if(existing[field]!==updated[field]){existing[field]=updated[field];changed=true;}}}else{val.rooms.push(updated);changed=true;}}if(changed)storage.setItem('digo:database',JSON.stringify(val));return val;}

      async joinInvite(code){const id=await query(supabase.rpc('join_private_room',{p_invite_code:code}));return await query(supabase.from('rooms').select('*').eq('id',id).single());},
      async joinRoom(roomId){if(joinedRooms.has(roomId))return;await query(supabase.from('room_members').upsert({room_id:roomId,user_id:await meId()},{onConflict:'room_id,user_id',ignoreDuplicates:true}));joinedRooms.add(roomId);},

    const stage=document.querySelector('.tag-stage-members');
    if(stage){
      const newStage=document.createElement('div');newStage.innerHTML=renderStage();
      const memberTags=newStage.querySelector('.tag-stage-members');
      if(memberTags&&stage.innerHTML!==memberTags.innerHTML)stage.replaceWith(memberTags);
    }
    const currentGame=app.roomData?.game,oldGame=previous?.game;
    const gameChanged=currentGame?.id!==oldGame?.id||currentGame?.status!==oldGame?.status||(app.roomData?.actions?.length||0)!==(previous?.actions?.length||0);
    if(gameChanged&&!document.activeElement?.classList?.contains('js-guess-input')){
      const panel=document.querySelector('.game-panel-inner');
      if(panel){const wrap=document.createElement('div');wrap.innerHTML=renderGame();const next=wrap.firstElementChild;if(next)panel.replaceWith(next);}
    }
    if(scroller&&(nearBottom||app.scrollToChat))scroller.scrollTop=scroller.scrollHeight;
    app.scrollToChat=false;
    syncJumpToLatest();
  }
  async function refreshRoom(){
    if(!app.me||!app.service)return;
    const roomId=app.roomId,request=++refreshVersion;
    try{
      const data=await app.service.getRoomData(roomId);
      if(roomId!==app.roomId||request!==refreshVersion)return;
      const previous=app.roomData;
      app.roomData=data;roomCache.set(roomId,data);
      if(app.lastFailure?.stage==='room sync')app.lastFailure=null;
      if(!app.socialOpen&&!app.roomSettingsOpen&&!app.profileOpen&&!app.makeRoomOpen&&!app.inviteOpen){
        if(document.querySelector('.app-shell'))updateRoomInPlace(previous);else draw();
      }
    }catch(e){
      if(roomId===app.roomId&&request===refreshVersion&&(!app.lastFailure||app.lastFailure.stage!=='room sync'||app.lastFailure.detail!==String(e?.message||'')))showFailure('room sync',e);
    }
  }
  async function enterRoom(id){
    if(!app.rooms.some(r=>r.id===id))throw Error('Room not available');
    const turn=++roomSwitchVersion;
    refreshVersion++;
    watchStop?.();watchStop=null;
    clearTimeout(refreshTimer);
    app.peers=[];app.roomId=id;
    app.roomData=roomCache.get(id)||emptyRoom();
    app.view='chat';app.resetScroll=true;app.composer='';app.guess='';app.gameFeedback='';
    app.chatSearch='';app.searchOpen=false;app.socialOpen=false;app.leaderboardOpen=false;app.roomSettingsOpen=false;
    draw(); // Switch immediately; do not wait for international database requests.
    await app.service.joinRoom(id);
    if(turn!==roomSwitchVersion)return;
    await refreshRoom();
    if(turn!==roomSwitchVersion)return;
    watchStop=app.service.watchRoom(id,()=>{clearTimeout(refreshTimer);refreshTimer=setTimeout(refreshRoom,80);},peers=>{if(turn!==roomSwitchVersion)return;app.peers=peers;});
  }
  async function afterAuth(){app.rooms=await app.service.getRooms();if(!app.rooms.length)throw Error('No DIGO rooms were returned. Check that the SQL setup ran on this Supabase project.');const params=new URLSearchParams(location.search);const code=params.get('invite');if(code){try{const r=await app.service.joinInvite(code);app.rooms=await app.service.getRooms();app.roomId=r.id;history.replaceState(null,'',location.pathname);}catch(e){app.notify='Invite could not be used: '+e.message;}}const lastRoom=storage.getItem('digo:last-room');if(lastRoom&&app.rooms.some(r=>r.id===lastRoom)&&!code)app.roomId=lastRoom;if(!app.rooms.some(r=>r.id===app.roomId))app.roomId=app.rooms[0]?.id||PUBLIC_ROOMS[0].id;await enterRoom(app.roomId);}
  async function run(asyncFn){if(app.busy){setTimeout(()=>run(asyncFn),70);return;}app.busy=true;try{await asyncFn();if(app.lastFailure?.stage!=='room sync')app.lastFailure=null;}catch(e){showFailure(e?.digoStage||'action failed',e);}finally{app.busy=false;}}
  document.addEventListener('input',e=>{const t=e.target;if(t.classList?.contains('js-draft-name')){app.draftName=t.value;const p=document.querySelector('.identity-preview strong');if(p)p.textContent=trimName(t.value)||'Your name';const b=document.querySelector('.identity-preview-badge .id-badge');if(b)b.textContent=initials(trimName(t.value)||'Your name');}if(t.id==='chat-input')app.composer=t.value;if(t.id==='person-search')app.socialQuery=t.value;if(t.id==='dm-input')app.dmDraft=t.value;if(t.id==='room-edit-name')app.roomEdit.name=t.value;if(t.id==='room-edit-description')app.roomEdit.description=t.value;if(t.id==='chat-search'){app.chatSearch=t.value;searchMessagesInPlace();}if(t.classList?.contains('js-guess-input'))app.guess=t.value;});
  document.addEventListener('scroll',e=>{if(e.target?.classList?.contains('content-scroll'))syncJumpToLatest();},true);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(app.profileOpen||app.makeRoomOpen||app.reportTarget||app.inviteOpen||app.viewProfileId||app.socialOpen||app.leaderboardOpen||app.roomSettingsOpen||app.dmReportTarget)){app.profileOpen=app.makeRoomOpen=app.inviteOpen=app.socialOpen=app.leaderboardOpen=app.roomSettingsOpen=false;app.reportTarget=null;app.dmReportTarget=null;app.viewProfileId=null;app.dmPeer=null;draw();}if(e.key==='Enter'&&e.target.classList?.contains('js-guess-input')){e.preventDefault();document.querySelector('[data-action="guess"]')?.click();}});
  document.addEventListener('submit',e=>{
    if(e.target?.id==='dm-form'){e.preventDefault();run(async()=>{const text=(app.dmDraft||'').trim();if(!text||!app.dmPeer)return;await app.service.sendDm(app.dmPeer,text);app.dmDraft='';await refreshSocial();requestAnimationFrame(()=>{const el=document.getElementById('dm-feed');if(el)el.scrollTop=el.scrollHeight;});});return;}
    if(e.target?.id!=='chat-form')return;
    e.preventDefault();
    const text=(document.getElementById('chat-input')?.value||app.composer||'').trim();
    if(!text||!app.me||!app.roomData)return;
    const roomId=app.roomId,localId='sending-'+uid();
    const pending={id:localId,room_id:roomId,user_id:app.me.id,body:text,created_at:new Date().toISOString(),pending:true};
    app.pendingMessages.push(pending);app.composer='';app.scrollToChat=true;
    const field=document.getElementById('chat-input');if(field)field.value='';
    updateRoomInPlace(app.roomData);field?.focus({preventScroll:true});
    void run(async()=>{
      try{
        await app.service.sendMessage(roomId,text);
        if(app.roomId===roomId)await refreshRoom();
        app.pendingMessages=app.pendingMessages.filter(m=>m.id!==localId);
      }catch(err){
        app.pendingMessages=app.pendingMessages.filter(m=>m.id!==localId);
        if(roomId===app.roomId){app.composer=text;const entry=document.getElementById('chat-input');if(entry)entry.value=text;updateRoomInPlace(app.roomData);}
        throw err;
      }
    });
  });
  document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;const d=btn.dataset;if(a==='retry-app'){location.reload();return;}if(a==='dismiss-diagnostic'){app.lastFailure=null;draw();return;}
    if(a==='social-open')return run(async()=>{app.socialOpen=true;app.socialTab='friends';app.dmPeer=null;await refreshSocial();});
    if(a==='social-tab'){app.socialTab=d.tab;app.dmPeer=null;draw();return;}
    if(a==='social-refresh')return run(async()=>{await refreshSocial();});
    if(a==='social-search')return run(async()=>{app.peopleSearch=await app.service.findPlayers(app.socialQuery||'');draw();});
    if(a==='friend-request'||a==='member-add')return run(async()=>{await app.service.sendFriendRequest(d.user);app.viewProfileId=null;app.socialOpen=true;app.socialTab='inbox';await refreshSocial();notify('Friend request sent. They must accept first.');});
    if(a==='friend-respond')return run(async()=>{await app.service.respondFriendRequest(d.id,d.accept==='yes');await refreshSocial();});
    if(a==='dm-open')return run(async()=>{app.dmPeer=d.user;app.dmDraft='';await refreshSocial();requestAnimationFrame(()=>{const el=document.getElementById('dm-feed');if(el)el.scrollTop=el.scrollHeight;});});
    if(a==='dm-close'){app.dmPeer=null;app.dmMessages=[];draw();return;}
    if(a==='dm-block')return run(async()=>{if(!app.dmPeer||!confirm('Block this friend? They will no longer be able to message you.'))return;await app.service.blockUser(app.dmPeer);app.dmPeer=null;app.dmMessages=[];await refreshSocial();notify('Player blocked.');});
    if(a==='leaderboard-open')return run(async()=>{app.leaderboard=await app.service.getLeaderboard(app.roomId);app.leaderboardOpen=true;draw();});
    if(a==='leaderboard-refresh')return run(async()=>{app.leaderboard=await app.service.getLeaderboard(app.roomId);draw();});
    if(a==='room-edit-open'){const r=getCurrentRoom();if(!r.is_private||r.owner_id!==app.me.id)return notify('Only the room owner can customize this room.');app.roomEdit={icon:r.icon,name:r.name,description:r.description||''};app.roomSettingsOpen=true;draw();return;}
    if(a==='room-edit-icon'){app.roomEdit.icon=d.icon;draw();return;}
    if(a==='room-edit-save')return run(async()=>{const name=String(document.getElementById('room-edit-name')?.value||'').trim().slice(0,36),description=String(document.getElementById('room-edit-description')?.value||'').trim().slice(0,120);if(name.length<3)throw Error('Use a room name of at least 3 letters.');await app.service.updateRoom(app.roomId,{name,description,icon:app.roomEdit.icon});app.rooms=await app.service.getRooms();app.roomSettingsOpen=false;draw();notify('Room saved! ✳');});
    if(a==='voice-info'){notify('Live voice needs a real HTTPS deployment, microphone permission, peer signaling and safety controls. It is not active in the local demo.');return;}
    if(a==='demo-create-user')return run(async()=>{const name=trimName(document.getElementById('demo-account-name')?.value);if(name.length<2)throw Error('Enter a demo nickname (2+ characters).');watchStop?.();app.me=await app.service.makeDemoAccount(name);app.socialOpen=false;app.dmPeer=null;await afterAuth();notify('Switched to new demo ID. Open Friends to switch back.');});
    if(a==='demo-switch-user')return run(async()=>{watchStop?.();app.me=await app.service.switchDemoAccount(d.user);app.socialOpen=false;app.dmPeer=null;await afterAuth();notify('Switched demo ID.');});
    if(a==='dm-report-open'){app.dmReportTarget=d.message;draw();return;}
    if(a==='dm-report-send')return run(async()=>{await app.service.reportDm(app.dmReportTarget,d.reason);app.dmReportTarget=null;draw();notify('DM report submitted for review.');});
    if(a==='dismiss'){if(btn.classList.contains('overlay')&&e.target!==btn)return;app.profileOpen=app.makeRoomOpen=app.inviteOpen=app.socialOpen=app.leaderboardOpen=app.roomSettingsOpen=false;app.reportTarget=null;app.dmReportTarget=null;app.viewProfileId=null;app.dmPeer=null;draw();return;}
    if(a==='jump-latest'){const scroller=document.querySelector('.content-scroll');scroller?.scrollTo({top:scroller.scrollHeight,behavior:'smooth'});syncJumpToLatest();return;}
    if(a==='search-toggle'){app.searchOpen=!app.searchOpen;if(!app.searchOpen)app.chatSearch='';draw();if(app.searchOpen)document.getElementById('chat-search')?.focus();return;}
    if(a==='search-clear'){app.chatSearch='';app.searchOpen=false;draw();return;}
    if(a==='dice-roll')return run(async()=>{const n=new Uint32Array(1);crypto.getRandomValues(n);await sendQuickMessage('🎲 Rolled a '+(n[0]%6+1)+'!');});
    if(a==='coin-flip')return run(async()=>{const n=new Uint32Array(1);crypto.getRandomValues(n);await sendQuickMessage('🪙 Flipped a coin: '+(n[0]%2?'TAILS':'HEADS')+'!');});
    if(a==='icebreaker'){const n=new Uint32Array(1);crypto.getRandomValues(n);app.composer=ICEBREAKERS[n[0]%ICEBREAKERS.length];draw();document.getElementById('chat-input')?.focus();return;}
    if(a==='member-profile'){app.viewProfileId=d.user;draw();return;}
    if(a==='profile-wave')return run(async()=>{app.viewProfileId=null;await app.service.sendEmote(app.roomId,'wave');await refreshRoom();notify('Wave sent! 👋');});
    if(a==='spotlight-game')return run(async()=>{app.viewProfileId=null;await app.service.startGame(app.roomId,'would_rather');app.view='game';app.gameFeedback='';await refreshRoom();});
    if(a==='set-avatar'){const field=d.field,index=Number(d.index);if(field==='color'&&Number.isInteger(index)&&index>=0&&index<ID_COLORS.length){app.draft.color=index;draw();}return;}
    if(a==='join-digo')return run(async()=>{const name=trimName(app.draftName);if(name.length<2)throw Error('Choose a nickname with at least 2 characters.');let step='guest sign-in';try{app.me=await app.service.signIn(name,{...app.draft});step='room setup';app.composer='';await afterAuth();}catch(e){e.digoStage=step;throw e;}});
    if(a==='room'){storage.setItem('digo:last-room',d.room);void enterRoom(d.room).catch(e=>showFailure('room switch',e));return;}
    if(a==='view'){app.view=d.view;draw();return;}
    if(a==='profile-open'){app.viewProfileId=null;app.profileOpen=true;app.draft={...app.me.avatar};app.draftName=app.me.display_name;draw();return;}
    if(a==='save-profile')return run(async()=>{const name=trimName(app.draftName);if(name.length<2)throw Error('Nickname must have at least 2 characters.');app.me={...app.me,display_name:name,avatar:{...app.draft}};await app.service.saveProfile(app.me);app.profileOpen=false;await refreshRoom();notify('ID updated! ✦');});
    if(a==='make-room-open'){app.makeRoomOpen=true;draw();return;}
    if(a==='make-room')return run(async()=>{const name=document.getElementById('room-name')?.value.trim();if(!name||name.length<3||name.length>36)throw Error('Room name must have 3–36 characters.');const r=await app.service.createRoom(name,document.getElementById('room-icon')?.value||'✳');app.rooms=await app.service.getRooms();app.makeRoomOpen=false;await enterRoom(r.id);notify('Private hangout created! Use ↗ to share an invite.');});
    if(a==='invite-open'){app.inviteOpen=true;draw();return;}
    if(a==='join-invite')return run(async()=>{let code=document.getElementById('invite-code')?.value.trim();if(!code)throw Error('Paste an invite link or code.');try{const u=new URL(code);code=u.searchParams.get('invite')||code;}catch{}const r=await app.service.joinInvite(code);app.rooms=await app.service.getRooms();app.inviteOpen=false;await enterRoom(r.id);notify('You joined the room!');});
    if(a==='share-room')return run(async()=>{const r=getCurrentRoom();const base=location.protocol==='file:'?'Open this room after putting DIGO on a website':location.origin+location.pathname;const url=r.is_private?(base+'?invite='+r.invite_code):base;try{await navigator.clipboard.writeText(url);notify(r.is_private?'Private invite link copied!':'Website link copied!');}catch{window.prompt('Copy this '+(r.is_private?'invite link':'link')+':',url);}});
    if(a==='emote')return run(async()=>{await app.service.sendEmote(app.roomId,d.emote);await refreshRoom();});
    if(a==='react')return run(async()=>{const msg=app.roomData?.messages.find(m=>m.id===d.message);if(msg?.sample)throw Error('Sample messages cannot be reacted to in live mode.');await app.service.reactToMessage(app.roomId,d.message,d.emoji);await refreshRoom();});
    if(a==='start-game')return run(async()=>{await app.service.startGame(app.roomId,d.kind);app.gameFeedback='';app.guess='';app.view='game';await refreshRoom();});
    if(a==='vote')return run(async()=>{const res=await app.service.actOnGame(app.roomData.game.id,d.choice);app.gameFeedback=res.note;await refreshRoom();});
    if(a==='guess')return run(async()=>{const guess=(app.guess||'').trim();if(!guess)throw Error('Enter your guess first.');const res=await app.service.actOnGame(app.roomData.game.id,guess);app.gameFeedback=res.note;if(res.correct)app.guess='';await refreshRoom();});
    if(a==='block')return run(async()=>{if(!confirm('Block this player? Their messages will be hidden for you.'))return;await app.service.blockUser(d.user);await refreshRoom();notify('Player blocked.');});
    if(a==='report-open'){app.reportTarget=d.message;draw();return;}
    if(a==='report-send')return run(async()=>{await app.service.reportMessage(app.reportTarget,d.reason);app.reportTarget=null;app.viewProfileId=null;draw();notify(app.service.mode==='demo'?'Demo report recorded locally.':'Report submitted for review.');});
  });
  async function boot(){root.innerHTML='<div class="loading-screen"><div class="loading-logo">digo<span>.</span></div><p>Making room for your vibe...</p></div>';try{const cfg=window.DIGO_CONFIG||{};app.service=cfg.supabaseUrl&&cfg.supabaseAnonKey?await createLiveService(cfg):createDemoService();app.me=await app.service.getMe();app.draft={...DEF_AVATAR};if(app.me)await afterAuth();else draw();}catch(e){console.error(e);root.innerHTML=`<div class="loading-screen"><h2>Could not start DIGO</h2><p>${esc(e?.message||'Unknown error')}</p><p>Check your internet connection or Supabase configuration, then refresh.</p><button onclick="location.reload()" style="padding:12px 22px;border:2px solid #202033;background:#d7fb75;border-radius:9px;font-weight:bold;cursor:pointer">TRY AGAIN</button></div>`;}}
  boot();
  setInterval(()=>{if(app.me && app.service?.mode==='demo'&&!app.socialOpen&&!app.roomSettingsOpen)refreshRoom();},8000);
})();
</script></body>
</html>
